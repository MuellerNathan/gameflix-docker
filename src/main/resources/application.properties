spring.application.name=gameflix-auth

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gameflix}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gameflix_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.lifetime-minutes=60
app.cors.allowed-origin=http://localhost:3000